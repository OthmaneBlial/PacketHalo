name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm bench
      - run: pnpm verify:privacy
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload documentation preview
        uses: actions/upload-artifact@v4
        with: { name: packethalo-web-preview, path: apps/web/dist }
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --manifest-path agent/rust-agent/Cargo.toml --check
      - run: cargo clippy --manifest-path agent/rust-agent/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path agent/rust-agent/Cargo.toml

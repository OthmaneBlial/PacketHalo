name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm verify
      - run: pnpm bench
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:site
      - name: Upload documentation preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: packethalo-web-preview, path: apps/web/dist }
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path agent/rust-agent/Cargo.toml --check
      - run: cargo clippy --manifest-path agent/rust-agent/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path agent/rust-agent/Cargo.toml
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version }
      - name: Build and start the production stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke HTTP, persistence, and proxied WebSocket paths
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8787/health
          curl --fail --silent --show-error http://127.0.0.1:8787/ready
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8081/ > /dev/null
          node --input-type=module -e 'const socket = new WebSocket("ws://127.0.0.1:8080/stream"); const timer = setTimeout(() => process.exit(1), 5000); socket.addEventListener("message", ({ data }) => { const message = JSON.parse(String(data)); if (message.type === "flow") { clearTimeout(timer); socket.close(); } }); socket.addEventListener("error", () => process.exit(1));'
      - name: Container status and logs
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail=100
      - name: Stop production stack
        if: always()
        run: docker compose down
